<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190" role="img" aria-labelledby="mf4t mf4d"><style>text{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#e6ecf5}.dim{fill:#9fb4cc}.box{fill:#14202e;stroke:#3b5a7c;stroke-width:1.5}.box2{fill:#1a2c1f;stroke:#4f8a5e;stroke-width:1.5}.arrow{stroke:#7fa6cf;stroke-width:2;fill:none;marker-end:url(#mfarr)}.bar1{fill:#6c7f96}.bar2{fill:#4da3ff}.bar3{fill:#2f6fbd}</style><rect width="100%" height="100%" rx="10" fill="#0b0f14" stroke="#24364a"/>
              <title id="mf4t">Layout of a FLAC file</title>
              <desc id="mf4d">A FLAC file starts with the four-byte marker fLaC and a STREAMINFO block holding sample rate, channels, bit depth, length and an MD5 of the audio. After that come frames. Each frame has a header with its own CRC-8, then one subframe per channel, then a CRC-16 footer.</desc>
              <text class="dim" x="20" y="22" font-size="12">A FLAC file, start to end (not to scale)</text>
              <rect class="box2" x="20" y="36" width="70" height="52" rx="6"/><text x="55" y="66" text-anchor="middle" font-size="13" font-weight="600">fLaC</text>
              <rect class="box2" x="96" y="36" width="190" height="52" rx="6"/><text x="191" y="58" text-anchor="middle" font-size="13" font-weight="600">STREAMINFO</text><text class="dim" x="191" y="76" text-anchor="middle" font-size="10.5">rate · channels · bits · length · MD5</text>
              <rect class="box" x="292" y="36" width="408" height="52" rx="6"/><text x="496" y="66" text-anchor="middle" font-size="13" font-weight="600">Frame 1 · Frame 2 · … · Frame N</text>
              <path d="M496,90 L496,108" stroke="#7fa6cf" stroke-width="2"/>
              <text class="dim" x="20" y="128" font-size="12">Inside one frame</text>
              <rect class="box" x="20" y="136" width="170" height="44" rx="6"/><text x="105" y="156" text-anchor="middle" font-size="12" font-weight="600">Header</text><text class="dim" x="105" y="171" text-anchor="middle" font-size="10.5">block size · rate · stereo mode · CRC-8</text>
              <rect class="box" x="196" y="136" width="330" height="44" rx="6"/><text x="361" y="156" text-anchor="middle" font-size="12" font-weight="600">One subframe per channel</text><text class="dim" x="361" y="171" text-anchor="middle" font-size="10.5">predictor type · coefficients · Rice-coded residual</text>
              <rect class="box" x="532" y="136" width="100" height="44" rx="6"/><text x="582" y="156" text-anchor="middle" font-size="12" font-weight="600">CRC-16</text><text class="dim" x="582" y="171" text-anchor="middle" font-size="10.5">whole frame</text>
            </svg>