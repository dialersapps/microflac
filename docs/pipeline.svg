<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="mf1t mf1d"><style>text{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#e6ecf5}.dim{fill:#9fb4cc}.box{fill:#14202e;stroke:#3b5a7c;stroke-width:1.5}.box2{fill:#1a2c1f;stroke:#4f8a5e;stroke-width:1.5}.arrow{stroke:#7fa6cf;stroke-width:2;fill:none;marker-end:url(#mfarr)}.bar1{fill:#6c7f96}.bar2{fill:#4da3ff}.bar3{fill:#2f6fbd}</style><rect width="100%" height="100%" rx="10" fill="#0b0f14" stroke="#24364a"/>
              <title id="mf1t">microflac encoder pipeline</title>
              <desc id="mf1d">Audio samples are split into 4096-sample blocks. For each block the encoder tries four stereo modes, then for each channel picks the smallest of constant, verbatim, fixed-predictor and linear-prediction subframes, searches the entropy-coding partitions, and writes a frame with checksums. A stream header with an MD5 of the audio comes first.</desc>
              <defs><marker id="mfarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fa6cf"/></marker></defs>
              <rect class="box" x="10" y="20" width="120" height="56" rx="8"/><text x="70" y="44" text-anchor="middle" font-size="14" font-weight="600">PCM samples</text><text class="dim" x="70" y="62" text-anchor="middle" font-size="11">8 / 16 / 24 bit</text>
              <path class="arrow" d="M130,48 L168,48"/>
              <rect class="box" x="170" y="20" width="130" height="56" rx="8"/><text x="235" y="44" text-anchor="middle" font-size="14" font-weight="600">4096-sample</text><text x="235" y="62" text-anchor="middle" font-size="14" font-weight="600">blocks</text>
              <path class="arrow" d="M300,48 L338,48"/>
              <rect class="box" x="340" y="12" width="190" height="72" rx="8"/><text x="435" y="34" text-anchor="middle" font-size="14" font-weight="600">Stereo mode</text><text class="dim" x="435" y="52" text-anchor="middle" font-size="11">left/right, left/side,</text><text class="dim" x="435" y="68" text-anchor="middle" font-size="11">right/side, mid/side</text>
              <path class="arrow" d="M435,84 L435,118"/>
              <rect class="box" x="300" y="120" width="260" height="92" rx="8"/><text x="430" y="142" text-anchor="middle" font-size="14" font-weight="600">Per channel: smallest wins</text>
              <text class="dim" x="430" y="162" text-anchor="middle" font-size="11">constant · verbatim</text><text class="dim" x="430" y="178" text-anchor="middle" font-size="11">fixed predictor, order 0–4</text><text class="dim" x="430" y="194" text-anchor="middle" font-size="11">linear prediction, order up to 12, 6 windows</text>
              <path class="arrow" d="M300,166 L242,166"/>
              <rect class="box" x="60" y="130" width="180" height="72" rx="8"/><text x="150" y="154" text-anchor="middle" font-size="14" font-weight="600">Entropy coding</text><text class="dim" x="150" y="172" text-anchor="middle" font-size="11">Rice partition search,</text><text class="dim" x="150" y="188" text-anchor="middle" font-size="11">escape codes</text>
              <path class="arrow" d="M150,202 L150,236"/>
              <rect class="box2" x="30" y="238" width="260" height="52" rx="8"/><text x="160" y="260" text-anchor="middle" font-size="14" font-weight="600">Frame + CRC-8 / CRC-16</text><text class="dim" x="160" y="278" text-anchor="middle" font-size="11">repeated for every block</text>
              <rect class="box2" x="400" y="238" width="290" height="52" rx="8"/><text x="545" y="260" text-anchor="middle" font-size="14" font-weight="600">Stream header (STREAMINFO)</text><text class="dim" x="545" y="278" text-anchor="middle" font-size="11">includes MD5 of the original audio</text>
              <path class="arrow" d="M290,264 L398,264" style="marker-start:url(#mfarr);marker-end:none"/>
            </svg>